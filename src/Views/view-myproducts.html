            <?php if (!empty($products)) : ?>
                <?php foreach ($products as $row): ?>
                    <tr>
                        <td><?php echo htmlspecialchars($row['id']); ?></td>
                        <td><?php echo htmlspecialchars($row['name']); ?></td>
                        <td>Rs.<?php echo number_format($row['price']); ?></td>
                        <td><?php echo htmlspecialchars($row['quantity']); ?></td>
                        <td class="actions">
                            <a href="/update-products?id=<?php echo $row['id']; ?>">
                                <button class="edit">Update</button>
                            </a>
                            <form action="/delete-product-submit?id=<?php echo $row['id']; ?>" method="post" style="display:inline;">
                                <button type="submit" class="delete" onclick="return confirm('Are you sure?');">Delete</button>

                    </tr>

                <tr>
                    <td colspan="4" style="text-align: center;">No products available.</td>
                </tr>
